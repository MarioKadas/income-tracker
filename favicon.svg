<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18C58B"/>
      <stop offset="1" stop-color="#0A7A5A"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE27A"/>
      <stop offset="1" stop-color="#F5B82E"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- bars -->
  <rect x="96" y="300" width="72" height="116" rx="16" fill="#fff" opacity="0.45"/>
  <rect x="188" y="248" width="72" height="168" rx="16" fill="#fff" opacity="0.65"/>
  <rect x="280" y="196" width="72" height="220" rx="16" fill="#fff" opacity="0.85"/>
  <rect x="372" y="144" width="72" height="272" rx="16" fill="#fff"/>
  <!-- trend line -->
  <polyline points="110,262 206,212 298,160 392,92" fill="none" stroke="#FFE27A" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="372,72 436,70 414,130" fill="#FFE27A" stroke="#FFE27A" stroke-width="6" stroke-linejoin="round" transform="rotate(8 410 92)"/>
  <!-- coin -->
  <circle cx="146" cy="150" r="62" fill="url(#coin)" stroke="#fff" stroke-width="8"/>
  <text x="146" y="176" font-family="Helvetica, Arial, sans-serif" font-size="80" font-weight="700" fill="#8A5A00" text-anchor="middle">€</text>
</svg>
